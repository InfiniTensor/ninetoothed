name: CPU interpreter

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/run_cpu_tests.py"
      - "docs/cpu_interpreter*"
      - "docs/source/cpu_interpreter.rst"
      - "docs/source/installation.rst"
      - "pyproject.toml"
      - "requirements-cpu.txt"
      - ".github/workflows/cpu-interpreter.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/run_cpu_tests.py"
      - "docs/cpu_interpreter*"
      - "docs/source/cpu_interpreter.rst"
      - "docs/source/installation.rst"
      - "pyproject.toml"
      - "requirements-cpu.txt"
      - ".github/workflows/cpu-interpreter.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-interpreter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-interpreter:
    name: CPU interpreter / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-cpu.txt
            pyproject.toml
      - name: Install CPU test dependencies
        run: |
          python -m pip install -r requirements-cpu.txt
          mkdir -p "$RUNNER_TEMP/nine-cpu-results"
          python --version > "$RUNNER_TEMP/nine-cpu-results/environment.txt"
          python -m pip freeze >> "$RUNNER_TEMP/nine-cpu-results/environment.txt"
      - name: Run the CPU interpreter regressions
        run: python scripts/run_cpu_tests.py --junitxml "$RUNNER_TEMP/nine-cpu-results/pytest.xml"
      - name: Validate the installed wheel and standalone replay
        shell: bash
        run: |
          cpu_work="$RUNNER_TEMP/ninetoothed-cpu-wheel"
          mkdir "$cpu_work"
          python -m pip wheel --no-deps --wheel-dir "$cpu_work/wheels" .
          python -m pip install --no-deps "$cpu_work"/wheels/ninetoothed-*.whl
          cp docs/cpu_interpreter_demo.py "$cpu_work/demo.py"
          cd "$cpu_work"
          python -I -c 'import importlib.util, pathlib, sys, ninetoothed; assert all(importlib.util.find_spec(p) is None for p in ("torch", "triton")); assert pathlib.Path(ninetoothed.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve()); print(ninetoothed.__file__)'
          python -I demo.py --debug --export replay
          python -I replay/replay.py
      - name: Upload CPU regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-interpreter-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/nine-cpu-results/
          if-no-files-found: warn
          retention-days: 14
