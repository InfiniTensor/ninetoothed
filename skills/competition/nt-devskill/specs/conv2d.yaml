name: conv2d
family: convolution
pattern: im2col_plus_matmul
composition: reuse_matmul_arrangement_and_application

description: 2D 卷积，通过 im2col 重排后复用 matmul

formula: "output = im2col(input) @ filter_reshaped"

inputs:
  - name: input
    ndim: 4
    dtype: float16
  - name: filter
    ndim: 4
    dtype: float16

outputs:
  - name: output
    ndim: 4
    dtype: float16

template: examples/conv2d/kernel.py
torch_wrapper: examples/conv2d/torch_impl.py

tile_strategy:
  type: composition
  reuse: "examples.matmul.kernel (arrangement + application)"
  im2col: "tile(strides=..., dilation=...) + ravel + flatten + permute"

reference: "torch.nn.functional.conv2d(input, filter)"

acceptance:
  correctness:
    shapes: [[1, 3, 32, 32]]
    atol: 0.01
    rtol: 0.01
  benchmark:
    shapes: [[4, 64, 32, 32]]
    warmup: 10
    trials: 50
