name: max_pool2d
family: reduction
pattern: window_tile_max

description: 2D 最大池化，按窗口 tile 后取最大值

formula: "output = max(window)"

inputs:
  - name: input
    ndim: 4
    dtype: float16

outputs:
  - name: output
    ndim: 4
    dtype: float16

template: examples/max_pool2d/kernel.py
torch_wrapper: examples/max_pool2d/torch_impl.py

tile_strategy:
  type: window
  window_height: "Symbol('WINDOW_HEIGHT', constexpr=True, upper_bound=16)"
  window_width: "Symbol('WINDOW_WIDTH', constexpr=True, upper_bound=16)"
  block_size: "Symbol('BLOCK_SIZE', meta=True)"
  fill_value: "float('-inf')"
  reduce: "ntl.max(input, axis=1)"

reference: "torch.nn.functional.max_pool2d(input, window_shape, stride=window_shape)"

acceptance:
  correctness:
    shapes: [[1, 3, 32, 32]]
    atol: 0
    rtol: 0
  benchmark:
    shapes: [[4, 64, 32, 32]]
    warmup: 10
    trials: 50
